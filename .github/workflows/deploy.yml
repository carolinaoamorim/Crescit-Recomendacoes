name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B verify --file pom.xml

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: "larinhazzz"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: larinhazzz/recomendacoes-ci:${{ github.sha }}

      - name: executing remote ssh commands using password
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        env:
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER || 'https://dev-s41b58hqkvvmdu13.us.auth0.com/' }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE || 'https://api.crescit-investimentos' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'http://localhost:5173' }}
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          envs: AUTH0_ISSUER,AUTH0_AUDIENCE,FRONTEND_URL
          script: |
            set -e
            IMAGE="larinhazzz/recomendacoes-ci:${{ github.sha }}"
            docker pull "$IMAGE"
            docker stop recomendacoes || true
            docker rm recomendacoes || true
            docker run -d -p 8081:8080 --name recomendacoes \
              -e AUTH0_ISSUER -e AUTH0_AUDIENCE -e FRONTEND_URL \
              "$IMAGE"



