spring.application.name=recomendacoes
server.port=${SERVER_PORT:8080}

# Auth0 compartilhado pelos tres servicos.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-s41b58hqkvvmdu13.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:https://api.acessor-investimentos}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recomendacoesdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

perfil.service.url=${PERFIL_SERVICE_URL:http://localhost:8081}

# Evento publicado pelo servico de Perfil quando o questionario muda.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=investment.events
app.rabbitmq.queues.profile-updated=recommendations.profile-updated
app.rabbitmq.routing-keys.profile-updated=profile.updated
